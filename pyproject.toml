[project]
name = "wrd-macos-sandbox"
version = "1.1.0"
description = "Unofficial macOS Apple Silicon patcher for selected Wargame: Red Dragon Sandbox Mod features"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "wgrd-cons-parsers",
  "wgrd-cons-tools",
]

[project.scripts]
wrd-sandbox = "wrd_sandbox.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrd_sandbox"]

[tool.pytest.ini_options]
pythonpath = ["src"]
